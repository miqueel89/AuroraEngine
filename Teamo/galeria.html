<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <style>

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .item {
            position: relative;
            width: 200px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }
        .item img {
            width: 100%;
            border-radius: 10px;
            transition: filter 0.3s ease-in-out;
        }
        .item:hover {
            transform: scale(1.1);
        }
        .item:hover img {
            filter: brightness(80%);
        }
    </style>
</head>
